name: Validate

# Contrôles (hassfest, HACS, tests) à chaque push ; sur main, une fois tout réussi, création du tag
# v<version de manifest.json> et de la release s'ils n'existent pas (version « …bN » = pré-version).
# Notes : .github/release-notes/v<version>.md s'il existe, sinon le CHANGELOG de la version.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q

  release:
    needs: [hassfest, hacs, tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Version du manifest
        id: v
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/torque_obd/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *b*|*a*|*rc*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Release déjà publiée ?
        id: existe
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          fi
      - name: Notes de version
        if: steps.existe.outputs.existe != 'oui'
        run: |
          v="${{ steps.v.outputs.version }}"
          if [ -f ".github/release-notes/v$v.md" ]; then
            cp ".github/release-notes/v$v.md" notes.md
          else
            awk -v h="## $v" '$0==h{f=1;print "## Torque OBD-II " substr($0,4);next} /^## /{f=0} f' CHANGELOG.md > notes.md
          fi
          cat notes.md
      - name: Créer le tag et la release
        if: steps.existe.outputs.existe != 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Torque OBD-II ${{ steps.v.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.pre }}
